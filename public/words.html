<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新概念英语1-4册 · 词汇学习</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231f2f4d'/><path d='M20 16v30a8 8 0 0 0 12 7 8 8 0 0 0 12-7V16' fill='none' stroke='%23f6f1e7' stroke-width='4' stroke-linejoin='round'/><path d='M18 26l13-5 15 5' fill='none' stroke='%23cf4d3a' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#f6f1e7; --paper2:#fbf7ef; --ink:#1f2f4d; --ink2:#3a4a63;
  --muted:#7a879b; --line:#e3dccc; --accent:#cf4d3a; --accent2:#1f6f8b;
  --chip:#e8e1d2; --chip-on:#1f2f4d; --ok:#1f7a4d; --card:#fffdf8;
}
html{scroll-behavior:auto;overflow-anchor:none}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
/* ===== header ===== */
.site-header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.hd{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 16px}
.brand{display:flex;gap:10px;align-items:center}
.brand .logo{width:34px;height:34px;flex:none}
.brand .t1{font-family:Georgia,"Songti SC",serif;font-size:20px;font-weight:700;letter-spacing:.3px}
.brand .t2{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:6px;font-size:12px;color:var(--ink2)}
.stats b{font-size:14px;color:var(--accent);font-family:Georgia,serif}
.controls{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* book tabs */
.books{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fffdf8}
.books button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
.books button.on{background:var(--accent);color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fffdf8}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.toggle input{width:15px;height:15px;accent-color:var(--accent)}
/* search */
.searchbar{padding:10px 16px 14px;border-bottom:1px solid var(--line)}
.search{position:relative;max-width:640px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:10px;background:#fffdf8;font-size:16px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent2)}
.srch-count{margin-top:6px;font-size:12px;color:var(--muted)}

/* ===== layout ===== */
.layout{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:22px 16px 80px;max-width:1240px;margin:0 auto}
.rail{position:sticky;top:160px;align-self:start;max-height:calc(100vh - 180px);overflow:auto;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:10px}
.rail h3{font-size:12px;letter-spacing:1px;color:var(--muted);padding:4px 6px 8px;font-weight:600}
.rail .all{padding:5px 8px;margin-bottom:6px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink2)}
.rail .all.on{background:var(--ink);color:#fff}
.rail .n{display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer}
.rail .n:hover{background:var(--chip)}
.rail .n.on{background:var(--accent)}
.rail .n .num{font-family:Georgia,serif;font-size:12.5px;font-weight:700;color:var(--accent);flex:none;min-width:26px}
.rail .n.on .num{color:#fff}
.rail .n .tt{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.rail .n.on .tt{color:rgba(255,255,255,.88)}
/* content */
main{min-width:0}
.lesson{margin-bottom:26px}
.lhead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
.lhead .no{font-family:Georgia,serif;font-size:26px;font-weight:700;color:var(--accent);letter-spacing:.5px;white-space:nowrap}
.lhead .tt{font-family:Georgia,"Songti SC",serif;font-size:19px;font-weight:700;color:var(--ink)}
.lhead .nw{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.word{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;position:relative;transition:box-shadow .15s}
.word:hover{box-shadow:0 3px 12px rgba(31,47,77,.08)}
.vbtn{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper2);color:var(--accent);cursor:pointer;display:grid;place-items:center;margin-top:2px}
.vbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.vbtn svg{width:16px;height:16px}
.w-main{min-width:0;flex:1}
.w-word{font-size:17px;font-weight:700;font-family:Georgia,"Times New Roman",serif;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.w-ph{font-size:13px;color:var(--accent2);font-family:Georgia,serif}
.w-me{font-size:13.5px;color:var(--ink2);margin-top:2px}
.w-ex{font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
.w-ex b{color:#8a93a3;font-weight:500}
.master{position:absolute;top:8px;right:10px;border:0;background:none;cursor:pointer;color:#cbbca0;padding:2px;line-height:1}
.master svg{width:15px;height:15px;display:block}
.master.on{color:#e0a11e}
.master.on svg{fill:currentColor}
/* quiz (hide Chinese) */
body.quiz .w-me{filter:blur(6px);user-select:none;transition:.15s}
body.quiz .word.reveal .w-me{filter:none}
/* empty */
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:15px}
/* ===== responsive ===== */
@media(max-width:860px){
  .layout{grid-template-columns:1fr;padding:16px 12px 70px}
  .rail{position:static;max-height:none;overflow:visible;display:flex;flex-wrap:wrap;gap:6px;border-radius:12px;padding:8px;margin-bottom:6px}
  .rail h3{width:100%}
  .rail .all{order:-1;margin-bottom:0}
  .rail .n{flex:0 0 auto;max-width:168px}
  .rail .n .tt{max-width:150px}
  .words{grid-template-columns:1fr}
  .brand .t2{display:none}
  /* 手机上搜索/试听占屏多、用得少，先藏起 */
  .searchbar{display:none}
}
@media(max-width:480px){
  .hd{gap:8px 10px}
  .controls{margin-left:0;width:100%}
  .w-word{font-size:16px}
  .lhead{flex-wrap:wrap}
  .lhead .nw{width:100%}
}
/* words-features-extra */

#content .word.playing{border-color:var(--accent);box-shadow:0 0 0 2px rgba(207,77,58,.22)}
#content .word.playing .vbtn{background:var(--accent);color:#fff;border-color:var(--accent)}

.lesson{scroll-margin-top:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.toolbar .search{flex:1 1 280px;max-width:none}
.trybox{display:flex;align-items:center;gap:0;flex:1 1 220px;max-width:360px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.trybox:focus-within{border-color:var(--accent2)}
.trybox input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;font-size:16px;color:var(--ink);outline:none}
.trybox .trybtn{flex:none;border:0;border-left:1px solid var(--line);background:var(--paper2);color:var(--accent);padding:0 14px;height:100%;min-height:40px;font-size:13px;font-weight:600;cursor:pointer}
.trybox .trybtn:hover{background:var(--accent);color:#fff;border-left-color:var(--accent)}
.ctrl-btn{border:0;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.ctrl-btn:hover{background:var(--ink)}
.prefs{position:relative;flex:none}
.prefs-btn{display:inline-flex;align-items:center;gap:4px;width:132px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:6px 7px;background:var(--card);color:var(--ink);cursor:pointer;font-size:13px}
.prefs-btn:hover{border-color:var(--accent2)}
.prefs.open .prefs-btn{border-color:var(--ink);background:var(--paper2)}
.prefs-btn .prefs-label{font-weight:600;flex:none}
.prefs-btn .prefs-sum{flex:1;min-width:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.prefs-btn .prefs-caret{flex:none;width:12px;height:12px;color:var(--ink2);transition:transform .15s}
.prefs-btn .prefs-caret svg{display:block;width:100%;height:100%}
.prefs.open .prefs-caret{transform:rotate(180deg)}
.prefs-panel{position:fixed;z-index:200;box-sizing:border-box;width:280px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 10px 28px rgba(31,47,77,.14);display:none}
.prefs.open .prefs-panel{display:block}
.prefs-panel .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prefs-panel .row + .row{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.prefs-panel .hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
.toggles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toggle{display:inline-flex;align-items:center;width:auto;padding:5px 10px;border-radius:8px;background:var(--chip);gap:7px}
.toggle:has(input:checked){background:var(--ink);color:#fff}
.toggle:has(input:checked) input{accent-color:#fff}
.chain-block{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;background:var(--paper2);border:1px solid var(--line)}
.chain-block.is-idle{opacity:.72}
.chain-block > .toggle{flex:none}
.chain-opts{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%}
.stepper{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);user-select:none}
.stepper .slabel{flex:none;white-space:nowrap}
.stepper .sctrl{display:inline-flex;align-items:center;border-radius:8px;background:var(--chip);overflow:hidden}
.stepper .sbtn{border:0;background:transparent;width:28px;height:30px;font-size:15px;line-height:1;color:var(--ink);cursor:pointer}
.stepper .sbtn:hover{background:rgba(31,47,77,.08)}
.stepper .sbtn:disabled{opacity:.35;cursor:default}
.stepper .sbtn:disabled:hover{background:transparent}
.stepper .sval{min-width:1.6em;text-align:center;font-weight:700;font-family:Georgia,serif;font-size:13px;color:var(--ink)}
.chain-block.is-idle .stepper{opacity:.55}
.srch-count{margin-top:8px}

.to-top{position:fixed;right:20px;bottom:24px;z-index:60;width:44px;height:44px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;box-shadow:0 6px 18px rgba(31,47,77,.22);transition:opacity .2s,background .15s}
.to-top.show{opacity:1;pointer-events:auto}
.to-top:hover{background:var(--accent)}
.to-top svg{width:20px;height:20px;display:block}
@media(max-width:720px){
  .to-top{right:14px;bottom:18px;width:42px;height:42px}
}
.modal-mask{position:fixed;inset:0;z-index:100;background:rgba(31,47,77,.45);display:none;align-items:center;justify-content:center;padding:16px}
.modal-mask:not([hidden]){display:flex}
.modal{width:min(640px,100%);max-height:min(80vh,720px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:0 12px 40px rgba(31,47,77,.18)}
.modal h2{font-family:Georgia,"Songti SC",serif;font-size:18px;margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin:0 0 12px}
.modal .actions button{border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
.modal .actions .primary{background:var(--accent);color:#fff}
.modal .actions .secondary{background:var(--chip);color:var(--ink)}
.modal .rw{display:grid;gap:8px}
.modal .word .w-me{filter:blur(6px);user-select:none;transition:.15s}
.modal .word.reveal .w-me{filter:none}
.modal .w-lesson{display:inline-block;margin-left:2px;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--ink2);font-size:11px;font-weight:600;font-family:Georgia,serif;vertical-align:middle}

</style>
</head>
<body>
<header class="site-header">
  <div class="hd wrap">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#1f2f4d"/><path d="M20 16v30a8 8 0 0 0 12 7 8 8 0 0 0 12-7V16" fill="none" stroke="#f6f1e7" stroke-width="4" stroke-linejoin="round"/><path d="M18 26l13-5 15 5" fill="none" stroke="#cf4d3a" stroke-width="3" stroke-linecap="round"/></svg>
      <div>
        <div class="t1">新概念英语 1-4 册</div>
        <div class="t2">词汇总表 · 单词 / 音标 / 释义</div>
      </div>
    </div>
    <div class="stats">
      <span><b id="statLessons">72</b> 课</span>
      <span><b id="statWords">1108</b> 词</span>
    </div>
    <div class="controls">
      <div class="books" id="bookTabs" role="group" aria-label="选择册别">
        <button data-b="1" class="on" onclick="switchBook(1)">第一册</button>
        <button data-b="2" onclick="switchBook(2)">第二册</button>
        <button data-b="3" onclick="switchBook(3)">第三册</button>
        <button data-b="4" onclick="switchBook(4)">第四册</button>
      </div>
      <div class="seg" id="voiceSeg" role="group" aria-label="发音选择">
        <button data-v="1" id="vBr" onclick="setVoice(1)">英音</button>
        <button data-v="2" class="on" id="vAm" onclick="setVoice(2)">美音</button>
      </div>
      <div class="prefs" id="prefsWrap">
        <button type="button" class="prefs-btn" id="prefsBtn" aria-expanded="false" aria-controls="prefsPanel">
          <span class="prefs-label">设置</span>
          <span class="prefs-sum" id="prefsSum"></span>
          <span class="prefs-caret" aria-hidden="true"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M2.1 4.2a1.1 1.1 0 0 1 1.56-.08L6 6.2l2.34-2.08a1.1 1.1 0 1 1 1.44 1.66l-3.06 2.72a1.1 1.1 0 0 1-1.44 0L2.22 5.78a1.1 1.1 0 0 1-.12-1.58z"/></svg></span>
        </button>
        <div class="prefs-panel" id="prefsPanel" role="dialog" aria-label="学习设置">
          <div class="row toggles">
            <label class="toggle"><input type="checkbox" id="quizBox"> 自测</label>
            <label class="toggle"><input type="checkbox" id="masterBox"> 只看易忘</label>
          </div>
          <div class="row">
            <div class="chain-block is-idle" id="chainOpts" title="勾选「连播」后，间隔与连读才生效">
              <label class="toggle"><input type="checkbox" id="autoPlayBox"> 连播</label>
              <div class="chain-opts">
                <div class="stepper" data-step="gap" aria-label="连播间隔秒数">
                  <span class="slabel">间隔</span>
                  <span class="sctrl">
                    <button type="button" class="sbtn" data-dir="-1" aria-label="减少间隔">−</button>
                    <span class="sval" id="chainGapVal">2</span>
                    <button type="button" class="sbtn" data-dir="1" aria-label="增加间隔">+</button>
                  </span>
                  <span class="slabel">秒</span>
                </div>
                <div class="stepper" data-step="repeat" aria-label="每词连读次数">
                  <span class="slabel">连读</span>
                  <span class="sctrl">
                    <button type="button" class="sbtn" data-dir="-1" aria-label="减少连读次数">−</button>
                    <span class="sval" id="chainRepeatVal">1</span>
                    <button type="button" class="sbtn" data-dir="1" aria-label="增加连读次数">+</button>
                  </span>
                  <span class="slabel">次</span>
                </div>
              </div>
            </div>
          </div>
          <div class="hint">间隔 / 连读会记住；需打开「连播」后才生效。</div>
        </div>
      </div>
      <button type="button" class="ctrl-btn" id="randBtn">随机练习</button>
    </div>
  </div>
  <div class="searchbar wrap">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="在当前册内搜索单词 / 释义，如 private、音乐会、优势">
      </div>
      <div class="trybox">
        <input id="tryWord" type="text" placeholder="试听任意单词" autocomplete="off" spellcheck="false">
        <button type="button" class="trybtn" id="tryBtn" aria-label="发音">发音</button>
      </div>
    </div>
    <div class="srch-count" id="srchCount"></div>
  </div>
</header>

<div class="layout">
  <nav class="rail" aria-label="按课浏览">
    <h3>按课浏览</h3>
    <div class="all on" data-l="all" onclick="pick('all')">全部</div>
    <div id="railNums"></div>
  </nav>
  <main id="content"></main>
</div>



<button type="button" class="to-top" id="toTop" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
</button>

<div class="modal-mask" id="randMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="randTitle">
    <h2 id="randTitle">随机练习</h2>
    <div class="sub" id="randSub">当前册随机 10 词 · 点击卡片显示释义</div>
    <div class="actions">
      <button type="button" class="secondary" id="randReveal">显示翻译</button>
      <button type="button" class="secondary" id="randClose">关闭</button>
      <button type="button" class="primary" id="randAgain">换一批</button>
    </div>
    <div class="rw" id="randList"></div>
  </div>
</div>

<script>

function clearPlaying(){
  document.querySelectorAll("#content .word.playing").forEach(function(el){ el.classList.remove("playing"); });
}
function revealPlaying(el){
  clearPlaying();
  if(!el) return;
  el.classList.add("playing");
  var rect = el.getBoundingClientRect();
  var topPad = headerOffset();
  var bottomPad = 28;
  var vh = window.innerHeight || document.documentElement.clientHeight;
  if(rect.top >= topPad && rect.bottom <= vh - bottomPad) return;
  var target = rect.top + window.pageYOffset - Math.max(topPad + 8, Math.min((vh - rect.height) / 3, vh * 0.28));
  jumpScroll(target);
}
function clampInt(n, min, max, fallback){
  n = parseInt(n, 10);
  if(isNaN(n)) n = fallback;
  return Math.max(min, Math.min(max, n));
}

function playChainStep(){
  if(!autoPlay || chainIdx >= chainQueue.length){ stopChain(); return; }
  var el = chainQueue[chainIdx];
  if(!el || !el.isConnected){ stopChain(); return; }
  revealPlaying(el);
  playOne(el.getAttribute("data-w"), function(){
    if(!autoPlay){ stopChain(); return; }
    chainWordCount++;
    var need = clampInt(chainRepeat, 1, 5, 1);
    if(chainWordCount < need){
      scheduleNextChain();
      return;
    }
    chainWordCount = 0;
    chainIdx++;
    if(chainIdx >= chainQueue.length){ stopChain(); return; }
    scheduleNextChain();
  });
}
function playMain(w){

  chainQueue = nodes.slice(i);
  chainIdx = 0;
  chainWordCount = 0;

}

    var m = saved.indexOf(key)>=0 ? " on":"";
    return '<div class="word" data-w="'+esc(r.w)+'">'+
      '<button class="vbtn" aria-label="播放 '+esc(r.w)+'" onclick="playMain(\''+jsq(r.w)+'\')">'+ICON_V+'</button>'+
      '<div class="w-main">'+
        '<div class="w-word">'+esc(r.w)+' <span class="w-ph">'+esc(r.p)+'</span></div>'+
        '<div class="w-me">'+esc(r.m)+'</div>'+
        (r.e ? '<div class="w-ex">'+esc(r.e)+'</div>' : '')+
      '</div>'+
      '<button class="master'+m+'" aria-label="掌握" data-k="'+esc(key)+'" onclick="toggleMaster(this)">'+ICON_STAR+'</button>'+
    '</div>';
  }).join("");
  return '<section class="lesson" id="L'+lno+'" data-l="'+lno+'">'+
    '<div class="lhead"><span class="no">'+esc(g)+'</span><span class="tt">'+esc(title)+'</span><span class="nw">'+n+' 词</span></div>'+
    '<div class="words">'+cards+'</div></section>';
}
function render(){
  var list = filtered(), g = groupByLesson(list);
  var html = "";
  g.order.forEach(function(lno){ html += lessonBlock(lno, g.map[lno]); });
  if(!html) html = '<div class="empty">没有匹配的单词，换个关键词试试</div>';
  document.getElementById("content").innerHTML = html;
  document.getElementById("srchCount").textContent = q ? "匹配 " + list.length + " 个词条" : "";
  updateRail();
  syncRailFromScroll();
}

/* ---------- 左侧课索引 ---------- */
function updateRail(){
  var nums="", full = filtered(), seen={};
  if(q || onlyMaster){
    full.forEach(function(r){ if(!seen[r.l]){seen[r.l]=1; nums+=numChip(r.l);} });
  } else {
    var keys = Object.keys(PER[bk]);
    if(!keys.length){}
    var lnos = RAW.filter(function(r){return r.b==bk}).map(function(r){return r.l});
    var uniq = []; lnos.forEach(function(l){ if(uniq.indexOf(l)<0) uniq.push(l); });
    uniq.sort(function(a,b){return a-b});
    uniq.forEach(function(l){ nums+=numChip(l); });
  }
  document.getElementById("railNums").innerHTML = nums;
  setRailActive(cur, false);
}
function numChip(lno){
  var on = cur==String(lno)?" on":"";
  var items = RAW.filter(function(r){return r.b==bk && String(r.l)==String(lno)});
  if(!items.length) return "";
  var g = items[0].g, title = items[0].t;
  return '<div class="n'+on+'" data-l="'+lno+'" onclick="pick(\''+lno+'\')"><span class="num">'+esc(g)+'</span><span class="tt">'+esc(title)+'</span></div>';
}
function headerOffset(){
  var hd = document.querySelector(".site-header");
  return (hd ? hd.getBoundingClientRect().height : 0) + 12;
}
function ensureRailChipVisible(chip){
  var rail = document.querySelector(".rail");
  if(!rail || !chip) return;
  if(rail.scrollHeight <= rail.clientHeight + 2) return;
  var rr = rail.getBoundingClientRect();
  var cr = chip.getBoundingClientRect();
  var delta = (cr.top + cr.height / 2) - (rr.top + rr.height / 2);
  if(Math.abs(delta) < 6) return;
  rail.scrollTop += delta;
}
function saveLessonPref(){
  try{
    var key = String(bk), val = String(cur);
    if(lessonMap[key] === val) return;
    lessonMap[key] = val;
    if(ls) ls.setItem("nce4lessons", JSON.stringify(lessonMap));
  }catch(e){}
}
function isMobileLayout(){
  return window.matchMedia && window.matchMedia("(max-width: 860px)").matches;
}
function setRailActive(l, scrollChip){
  var next = String(l);
  var changed = String(cur) !== next;
  cur = next;
  if(changed) saveLessonPref();
  document.querySelectorAll(".rail .n").forEach(function(x){
    x.classList.toggle("on", String(x.dataset.l)===next);
  });
  var allBtn = document.querySelector(".rail .all");
  if(allBtn) allBtn.className = "all"+(next==="all"?" on":"");
  // 手机侧栏在页面顶部、阅读时看不到，不必跟滚居中
  if(scrollChip !== false && next !== "all" && !isMobileLayout()){
    var chip = document.querySelector('.rail .n[data-l="'+next+'"]');
    ensureRailChipVisible(chip);
  }
}
function scrollToLesson(lno){
  if(lno === "all"){ jumpScroll(0); return; }
  var el = document.getElementById("L"+lno);
  if(!el) return;
  // 强制布局后一次算准：停在吸顶头下方，避免先顶到 0 再被顶栏盖住造成闪动
  void el.offsetHeight;
  var off = headerOffset();
  jumpScroll(el.getBoundingClientRect().top + window.pageYOffset - off);
}
function restoreLessonView(){
  if(cur === "all"){
    setRailActive("all", false);
    jumpScroll(0);
    return;
  }
  var el = document.getElementById("L"+cur);
  if(!el){
    cur = "all";
    saveLessonPref();
    setRailActive("all", false);
    jumpScroll(0);
    return;
  }
  lockRailBriefly();
  setRailActive(cur, false);
  scrollToLesson(cur);
}
function rectInView(r, top, bottom){
  return r.bottom > top && r.top < bottom;
}
function syncRailFromScroll(){
  if(railLock || railBooting) return;
  // 手机上看不见侧栏跟滚，跳过整段计算
  if(isMobileLayout()) return;
  var lessons = document.querySelectorAll("#content .lesson");
  if(!lessons.length){
    if(cur !== "all") setRailActive("all");
    return;
  }
  if(window.pageYOffset <= 12){
    if(cur !== "all") setRailActive("all");
    return;
  }
  var top = headerOffset();
  var bottom = window.innerHeight || document.documentElement.clientHeight;
  var primary = null;
  var primaryNoTop = Infinity;
  var coverPrimary = null;
  var firstVisible = null;

  for(var i=0;i<lessons.length;i++){
    var les = lessons[i];
    var id = les.getAttribute("data-l");
    var lr = les.getBoundingClientRect();
    if(!rectInView(lr, top, bottom)) continue;
    if(!firstVisible) firstVisible = id;
    if(lr.top <= top + 8 && lr.bottom > top + 8) coverPrimary = id;

    var no = les.querySelector(".lhead .no");
    if(!no) continue;
    var nr = no.getBoundingClientRect();
    if(rectInView(nr, top, bottom) && nr.top < primaryNoTop){
      primaryNoTop = nr.top;
      primary = id;
    }
  }

  if(!primary) primary = coverPrimary || firstVisible;
  if(!primary){
    var docH = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    if(window.pageYOffset + bottom >= docH - 48){
      primary = lessons[lessons.length - 1].getAttribute("data-l");
    }
  }
  if(!primary){
    if(cur !== "all") setRailActive("all");
    return;
  }
  if(String(cur) !== String(primary)) setRailActive(primary);
}
function onWindowScrollRail(){
  if(isMobileLayout()) return;
  if(railScrollRaf) return;
  railScrollRaf = requestAnimationFrame(function(){
    railScrollRaf = 0;
    syncRailFromScroll();
  });
}
function lockRailBriefly(){
  railLock = true;
  if(railLockTimer) clearTimeout(railLockTimer);
  railLockTimer = setTimeout(function(){
    railLock = false;
    syncRailFromScroll();
  }, 450);
}
function jumpScroll(top){
  var y = Math.max(0, top);
  try{ window.scrollTo({top:y, left:0, behavior:"auto"}); }
  catch(e){ window.scrollTo(0, y); }
}
function pick(l){
  lockRailBriefly();
  setRailActive(l, false);
  if(l==="all"){ jumpScroll(0); return; }
  scrollToLesson(l);
}
function switchBook(n){
  railBooting = true;
  bk = n; try{ ls.setItem("nce4book", String(n)); }catch(e){}
  var savedLesson = lessonMap[String(n)];
  cur = (savedLesson === "all" || (savedLesson != null && String(savedLesson) !== "")) ? String(savedLesson) : "all";
  q=""; quiz=false;
  stopChain();
  document.getElementById("q").value="";
  document.getElementById("quizBox").checked=false;
  document.getElementById("autoPlayBox").checked=false; autoPlay=false;
  document.getElementById("masterBox").checked=onlyMaster;
  syncChainSteppers();
  document.body.classList.remove("quiz");
  setPrefsOpen(false);
  closeRand();
  document.querySelectorAll("#bookTabs button").forEach(function(x){ x.classList.toggle("on", +x.dataset.b===n); });
  updateStats();
  render();
  // 同帧内渲染并定位，避免先画到顶栏下方再校正的闪一下
  restoreLessonView();
  railBooting = false;
}

/* ---------- 交互 ---------- */
function toggleMaster(btn){
  var k = btn.dataset.k, i = saved.indexOf(k);
  if(i>=0) saved.splice(i,1); else saved.push(k);
  try{ ls.setItem("nceMaster4", JSON.stringify(saved)); }catch(e){}
  btn.className="master"+(saved.indexOf(k)>=0?" on":"");
  if(onlyMaster) render();
}
document.addEventListener("click",function(e){
  if(!quiz) return;
  var w=e.target.closest(".word");
  if(w && !e.target.closest("button")) w.classList.add("reveal");
});
document.getElementById("q").addEventListener("input",function(e){ q=e.target.value.trim(); render(); });
document.getElementById("quizBox").addEventListener("change",function(e){
  quiz=e.target.checked;
  document.body.classList.toggle("quiz",quiz);
  updatePrefsSummary();
  render();
});
document.getElementById("masterBox").addEventListener("change",function(e){
  onlyMaster=e.target.checked;
  try{ if(ls) ls.setItem("nceOnlyMaster", onlyMaster ? "1" : "0"); }catch(err){}
  updatePrefsSummary();
  render();
});
function setVoice(t){
  vType=t;
  try{ if(ls) ls.setItem("nceVoice", String(t)); }catch(e){}
  document.querySelectorAll("#voiceSeg button").forEach(function(x){x.classList.toggle("on", +x.dataset.v===t);});
}
document.querySelector(".rail .all").addEventListener("click",function(){ pick("all"); });
/* 册别 tab 先按当前 bk 同步；口音 / 易忘等在 loadChainPrefs 之后再刷 */
document.querySelectorAll("#bookTabs button").forEach(function(x){ x.classList.toggle("on", +x.dataset.b===bk); });

/* ---------- 随机练习 ---------- */
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}
function sampleBook(n){
  var pool = RAW.filter(function(r){ return r.b==bk; }).slice();
  shuffle(pool);
  return pool.slice(0, Math.min(n, pool.length));
}
function renderRandList(items){
  var html = items.map(function(r){
    var key = mkey(r);
    var m = saved.indexOf(key)>=0 ? " on":"";
    return '<div class="word" data-w="'+esc(r.w)+'">'+
      '<button class="vbtn" aria-label="播放 '+esc(r.w)+'" onclick="playTry(\''+jsq(r.w)+'\')">'+ICON_V+'</button>'+
      '<div class="w-main">'+
        '<div class="w-word">'+esc(r.w)+' <span class="w-ph">'+esc(r.p)+'</span> <span class="w-lesson">第'+esc(r.g)+'课</span></div>'+
        '<div class="w-me">'+esc(r.m)+'</div>'+
        (r.e ? '<div class="w-ex">'+esc(r.e)+'</div>' : '')+
      '</div>'+
      '<button class="master'+m+'" aria-label="易忘" data-k="'+esc(key)+'" onclick="toggleMaster(this)">'+ICON_STAR+'</button>'+
    '</div>';
  }).join("");
  document.getElementById("randList").innerHTML = html || '<div class="empty">当前册没有单词</div>';
  document.getElementById("randSub").textContent = "当前册随机 "+items.length+" 词 · 点击卡片显示释义";
  var revealBtn = document.getElementById("randReveal");
  if(revealBtn){ revealBtn.textContent = "显示翻译"; revealBtn.dataset.on = "0"; }
}
function openRand(){
  renderRandList(sampleBook(10));
  document.getElementById("randMask").hidden = false;
}
function closeRand(){
  var mask = document.getElementById("randMask");
  if(mask) mask.hidden = true;
  randMaskPtrDown = false;
}
function trySpeak(){
  playTry(document.getElementById("tryWord").value);
}

loadChainPrefs();
document.querySelectorAll("#voiceSeg button").forEach(function(x){ x.classList.toggle("on", +x.dataset.v===vType); });
document.getElementById("masterBox").checked = onlyMaster;
syncChainSteppers();
document.getElementById("prefsBtn").addEventListener("click", function(e){
  e.stopPropagation();
  var wrap = document.getElementById("prefsWrap");
  setPrefsOpen(!(wrap && wrap.classList.contains("open")));
});
document.getElementById("prefsPanel").addEventListener("click", function(e){ e.stopPropagation(); });
document.addEventListener("click", function(){ setPrefsOpen(false); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") setPrefsOpen(false);
});
window.addEventListener("resize", placePrefsPanel);
window.addEventListener("scroll", placePrefsPanel, true);
document.getElementById("autoPlayBox").addEventListener("change", function(e){
  autoPlay = e.target.checked;
  if(!autoPlay) stopChain();
  syncChainSteppers();
});
document.getElementById("chainOpts").addEventListener("click", function(e){
  var btn = e.target.closest(".sbtn");
  if(!btn || btn.disabled) return;
  var box = btn.closest(".stepper");
  if(!box) return;
  var dir = +btn.getAttribute("data-dir");
  var kind = box.getAttribute("data-step");
  if(kind === "repeat"){
    chainRepeat = clampInt(chainRepeat + dir, 1, 5, 1);
  }else{
    chainGap = clampInt(chainGap + dir, 1, 5, 2);
  }
  saveChainPrefs();
  syncChainSteppers();
});
document.getElementById("tryBtn").addEventListener("click", trySpeak);
document.getElementById("tryWord").addEventListener("keydown", function(e){
  if(e.key==="Enter"){ e.preventDefault(); trySpeak(); }
});
document.getElementById("randBtn").addEventListener("click", openRand);
document.getElementById("randAgain").addEventListener("click", function(){ renderRandList(sampleBook(10)); });
document.getElementById("randReveal").addEventListener("click", function(){
  var btn = document.getElementById("randReveal");
  var on = btn.dataset.on === "1";
  document.querySelectorAll("#randList .word").forEach(function(el){
    el.classList.toggle("reveal", !on);
  });
  btn.dataset.on = on ? "0" : "1";
  btn.textContent = on ? "显示翻译" : "隐藏翻译";
});
document.getElementById("randClose").addEventListener("click", closeRand);
(function(){
  var mask = document.getElementById("randMask");
  mask.addEventListener("pointerdown", function(e){
    randMaskPtrDown = (e.target === mask);
  });
  mask.addEventListener("pointerup", function(e){
    if(randMaskPtrDown && e.target === mask) closeRand();
    randMaskPtrDown = false;
  });
  mask.addEventListener("pointercancel", function(){ randMaskPtrDown = false; });
})();
document.getElementById("randList").addEventListener("click", function(e){
  var w = e.target.closest(".word");
  if(w && !e.target.closest("button")) w.classList.add("reveal");
});


(function(){
  var btn = document.getElementById("toTop");
  if(!btn) return;
  function sync(){ btn.classList.toggle("show", window.pageYOffset > 360); }
  window.addEventListener("scroll", sync, {passive:true});
  sync();
  btn.addEventListener("click", function(){
    lockRailBriefly();
    setRailActive("all");
    jumpScroll(0);
  });
})();
window.addEventListener("scroll", onWindowScrollRail, {passive:true});

updateStats();
render();
restoreLessonView();
railBooting = false;
</script>
</body>
</html>
